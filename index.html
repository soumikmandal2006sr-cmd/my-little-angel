<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#12080b;--wine:#6b1d33;--deep:#3a0e1c;--blush:#f3cdd6;--lav:#d8cbe8;--text:#fbeef0;--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(120% 90% at 50% 0%,var(--deep),var(--ink) 65%) fixed;color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
h1,h2{font-family:var(--serif);font-weight:600;line-height:1.1}
.page{display:none;min-height:100vh;padding:80px 22px 56px;flex-direction:column;align-items:center;position:relative;z-index:1}
.page.active{display:flex}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blush);outline-offset:3px}
#back,#mus{position:fixed;top:16px;z-index:20;background:rgba(58,14,28,.85);border:1px solid rgba(243,205,214,.4);color:var(--blush);padding:9px 16px;border-radius:999px;font-size:.9rem}
#back{left:16px;display:none}#mus{right:16px}
.btn{background:var(--blush);color:var(--deep);border:0;padding:13px 28px;border-radius:4px 16px 4px 16px;font-weight:500;font-size:1rem}
.btn:disabled{opacity:.45;cursor:default}

/* menu */
#menu{justify-content:center;text-align:center}
#menu h1{font-size:clamp(2.6rem,9vw,5rem);color:var(--blush);margin-bottom:14px}
#menu .sub{color:var(--lav);margin-bottom:38px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;max-width:780px;width:100%}
.tile{text-align:left;background:linear-gradient(160deg,var(--wine),var(--deep));border:1px solid rgba(243,205,214,.3);border-radius:4px 24px 4px 24px;padding:26px 22px;font-family:var(--serif);font-size:1.7rem;color:var(--blush);transition:transform .25s,border-color .25s}
.tile small{display:block;font-family:var(--sans);font-size:.82rem;color:var(--lav);margin-top:8px}
.tile:hover{transform:translateY(-4px);border-color:var(--blush)}

/* wish */
.wish{max-width:680px;margin:auto}
#wishText{white-space:pre-wrap;font-family:var(--serif);font-size:clamp(1.5rem,4.2vw,2.5rem);line-height:1.35;color:var(--blush);cursor:pointer;min-height:8em}
#sign{margin-top:26px;font-family:var(--serif);font-style:italic;font-size:1.5rem;color:var(--lav);text-align:right}

/* cake */
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bunting{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-around;z-index:0}
#bunting i{width:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid var(--c)}
.balloon{position:absolute;bottom:-90px;width:44px;height:56px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:.85;animation:rise 10s linear infinite}
.balloon:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:50px;background:var(--lav)}
@keyframes rise{to{transform:translateY(-120vh)}}
#cakeSvg{width:min(380px,90vw);margin-top:20px}
.half{transition:transform .8s ease 1s;transform-box:fill-box;transform-origin:50% 100%}
.cut .hl{transform:translateX(-18px) rotate(-3deg)}
.cut .hr{transform:translateX(18px) rotate(3deg)}
.candle{cursor:pointer;transition:opacity .4s}.cut .candle{opacity:0}
.flame{transition:opacity .3s}.candle.out .flame{opacity:0}
#knife{transform:translateY(-150px);opacity:0;transition:transform .9s ease,opacity .2s}
.cut #knife{transform:translateY(0);opacity:1}
#cutMsg{font-family:var(--serif);font-size:1.8rem;color:var(--blush);margin-top:16px;min-height:2.2rem;text-align:center}
.tip{color:var(--lav);font-size:.9rem;margin-bottom:18px}
.conf{position:fixed;top:-14px;width:8px;height:14px;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}

/* gift */
#giftBox{background:none;border:0;font-size:9rem;line-height:1;margin:34px 0 10px}
.shake{animation:shake .6s}
@keyframes shake{20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
#giftHint{font-family:var(--serif);font-size:1.6rem;color:var(--blush);text-align:center;max-width:520px;min-height:3rem;margin-top:14px}

/* my little angel (photos + wishes) */
.page h2.t{font-size:clamp(2rem,6vw,3rem);color:var(--blush);margin-bottom:26px;text-align:center}
#timeline{display:flex;flex-direction:column;gap:34px;max-width:420px;width:100%}
.mem{background:var(--text);padding:12px 12px 18px;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.mem:nth-child(odd){transform:rotate(-1.6deg)}.mem:nth-child(even){transform:rotate(1.4deg)}
/* each photo keeps its own shape (portrait, landscape or square), nothing is cropped */
.mem img{width:100%;height:auto;display:block;background:var(--blush)}
.ph{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:var(--blush);color:var(--wine);text-align:center;padding:10px;font-size:.9rem}
.mem figcaption{font-family:var(--serif);font-style:italic;font-size:1.2rem;line-height:1.3;color:var(--deep);margin-top:12px;text-align:center}
.tag{display:block;font-family:var(--sans);font-style:normal;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--wine);margin-bottom:6px}

/* reasons */
#reasonsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;max-width:800px;width:100%}
.flip{perspective:800px;background:none;border:0;height:160px}
.in{position:relative;display:block;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;padding:14px;border-radius:4px 20px 4px 20px;border:1px solid rgba(243,205,214,.35)}
.f{background:linear-gradient(160deg,var(--wine),var(--deep));font-size:2.2rem;color:var(--blush)}
.f small{font-size:.8rem;color:var(--lav)}
.b{background:var(--blush);color:var(--deep);transform:rotateY(180deg);font-family:var(--serif);font-size:1.2rem;line-height:1.25;font-weight:600}

/* quiz */
#quiz{max-width:520px;width:100%;text-align:center}
#quiz h2{font-size:clamp(1.8rem,5vw,2.4rem);color:var(--blush);margin-bottom:24px}
.qn{color:var(--lav);margin-bottom:10px;font-size:.9rem}
.opt{display:block;width:100%;margin-bottom:12px;padding:15px;background:var(--deep);border:1px solid rgba(243,205,214,.35);border-radius:4px 16px 4px 16px;font-size:1.05rem;transition:background .2s}
.opt:hover:not(:disabled){background:var(--wine)}
.opt.ok{background:#3f6b4f;border-color:#a7e0bb}.opt.no{background:#7a2230;border-color:#ff9aa8}
.react{font-family:var(--serif);font-size:1.4rem;color:var(--blush);margin:16px 0;min-height:1.6em;line-height:1.3}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.res{font-family:var(--serif);font-size:1.6rem;color:var(--lav);margin:14px 0 26px;line-height:1.3}
.ans{text-align:left;background:var(--deep);border:1px solid rgba(243,205,214,.3);border-radius:4px 16px 4px 16px;padding:16px 18px;margin-bottom:12px}
.ans small{color:var(--lav);display:block;margin-bottom:4px}
.ans b{font-family:var(--serif);font-size:1.25rem;color:var(--blush);font-weight:600}
.ans .a{color:#a7e0bb;margin:8px 0 4px}
.ans .why{color:var(--text);font-size:.95rem;line-height:1.4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button id="back">← Go back</button>
<button id="mus" aria-label="Toggle music">♪ Music</button>
<audio id="bgm" src="assets/song.mp3" loop></audio>

<section class="page active" id="menu">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="grid">
    <button class="tile" data-go="wish">Birthday wish<small>Words from me to you</small></button>
    <button class="tile" data-go="cake">Let’s cut the cake<small>Candles, balloons, confetti</small></button>
    <button class="tile" data-go="gift">Birthday gift<small>Your surprise</small></button>
    <button class="tile" data-go="memories">My Little Angel<small>The most beautiful girl in the whole universe</small></button>
    <button class="tile" data-go="reasons">Reasons I love you<small>Tap each card</small></button>
    <button class="tile" data-go="game">Mini game<small>How well do you know us?</small></button>
  </div>
</section>

<section class="page" id="wish">
  <div class="wish"><p id="wishText"></p><p id="sign"></p></div>
</section>

<section class="page" id="cake">
  <div id="bunting"></div><div id="deco"></div>
  <p class="tip">Tap the candles to blow them out, then cut the cake.</p>
  <svg id="cakeSvg" viewBox="0 0 300 270" aria-label="Birthday cake">
    <defs>
      <g id="body">
        <rect x="40" y="170" width="220" height="70" rx="10" fill="#6b1d33"/>
        <rect x="70" y="125" width="160" height="50" rx="10" fill="#f3cdd6"/>
        <path d="M70 150q10 14 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0" fill="none" stroke="#fbeef0" stroke-width="5" stroke-linecap="round"/>
        <g fill="#d8cbe8"><circle cx="62" cy="228" r="3"/><circle cx="238" cy="228" r="3"/><circle cx="92" cy="226" r="3"/><circle cx="208" cy="226" r="3"/></g>
        <text id="cakeName" x="150" y="212" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="22" fill="#f3cdd6"></text>
      </g>
      <clipPath id="cl"><rect x="0" y="90" width="150" height="180"/></clipPath>
      <clipPath id="cr"><rect x="150" y="90" width="150" height="180"/></clipPath>
    </defs>
    <ellipse cx="150" cy="244" rx="135" ry="12" fill="#2a0a14"/>
    <g class="half hl"><use href="#body" clip-path="url(#cl)"/></g>
    <g class="half hr"><use href="#body" clip-path="url(#cr)"/></g>
    <g class="candle"><rect x="112" y="88" width="6" height="38" fill="#d8cbe8"/><ellipse class="flame" cx="115" cy="78" rx="5" ry="9" fill="#ffd9a0"/><circle cx="115" cy="85" r="18" fill="transparent"/></g>
    <g class="candle"><rect x="147" y="88" width="6" height="38" fill="#d8cbe8"/><ellipse class="flame" cx="150" cy="78" rx="5" ry="9" fill="#ffd9a0"/><circle cx="150" cy="85" r="18" fill="transparent"/></g>
    <g class="candle"><rect x="182" y="88" width="6" height="38" fill="#d8cbe8"/><ellipse class="flame" cx="185" cy="78" rx="5" ry="9" fill="#ffd9a0"/><circle cx="185" cy="85" r="18" fill="transparent"/></g>
    <g id="knife"><rect x="147" y="60" width="6" height="150" fill="#e9e3ea"/><rect x="141" y="22" width="18" height="40" rx="4" fill="#3a0e1c" stroke="#f3cdd6"/></g>
  </svg>
  <p id="cutMsg"></p>
  <button class="btn" id="cutBtn">Cut the cake</button>
</section>

<section class="page" id="gift">
  <h2 class="t">Your gift</h2>
  <button id="giftBox" aria-label="Gift box">🎁</button>
  <h2 style="color:var(--blush);font-size:2.2rem">That’s a surprise 🤭</h2>
  <p id="giftHint"></p>
</section>

<section class="page" id="memories">
  <h2 class="t">My Little Angel</h2>
  <div id="timeline"></div>
</section>

<section class="page" id="reasons">
  <h2 class="t">Reasons I love you</h2>
  <div id="reasonsGrid"></div>
</section>

<section class="page" id="game">
  <div id="quiz"></div>
</section>

<script>
/* ============ EDIT YOUR CONTENT HERE ============ */
const C={
  her:"Suhani",              // her name (also printed on the cake)
  me:"Soumik",               // your name (signature on the wish)
  wish:"Happy Birthday, my love.\n\nHappiest Birthday to the girl who has completely changed my life and made every single day infinitely brighter just by being in it. From the moment you walked into my world, you haven't just been my girlfriend, you’ve become my best friend, my wife, my safe place, my favorite view, my calm in the noise, the best part of my day, my quiet obsession and the reason behind my biggest smiles. I love the way your eyes light up when you laugh, the endless warmth and kindness you carry in your heart, and how effortlessly you make even the most ordinary moments feel like memories I want to hold onto forever. Thank you for every late-night talk, every shared laugh, every quiet moment of comfort, and for loving me so genuinely for who I am. You deserve all the happiness, love, and magic this world has to offer today and always, and I feel like the luckiest guy alive just getting to walk beside you and celebrate you, today, tomorrow, and for every birthday to come.\n\nI love you.",
  giftTeases:[               // shown one by one each time she taps the gift box; the last one stays
  "Nice try 😏",
  "Nope. Still a surprise.",
  "My lips are sealed 🤐",
  "You’re very persistent, honey…",
  "Okay, okay. Your gift isn’t here. It’s waiting for you in real life ❤️"
],

  /* "My Little Angel" page: photos live in the assets folder */
  memories:[
    {img:"assets/cute.jpeg",tag:"Cutest",
     cap:"Happy Birthday to the girl whose slightest smile makes my heart melt. You are effortlessly the cutest thing in the world, and I’m the luckiest guy to call you mine."},
    {img:"assets/beautiful.jpeg",tag:"Most Beautiful",
     cap:"Happy Birthday, gorgeous. Every time I look at you, I’m completely captivated. You are stunning inside and out, and I fall more in love with you every single day."},
    {img:"assets/sweet.jpeg",tag:"Sweetest",
     cap:"To the sweetest soul I know, Happy Birthday! Your kindness and warmth make life so much brighter. Thank you for being the most loving and caring partner I could ever ask for."},
    {img:"assets/admirable.jpeg",tag:"Most Admirable",
     cap:"Happy Birthday to the woman I admire more than anyone else. Your strength, your intelligence, and how you handle everything with grace inspire me constantly. I’m so proud to be by your side."},
    {img:"assets/hot.jpeg",tag:"Hottest and Sexiest",
     cap:"Happy Birthday to the absolute hottest and the sexiest girlfriend on the planet. You are gorgeous, fierce, sexy and completely breathtaking. I still can’t believe how I pulled a fine shyt like you."},
    {img:"assets/best.jpeg",tag:"Best",
     cap:"Happy Birthday to the Best. You aren’t just my girlfriend; you’re my best friend, my wife, my adventure partner, and my everything. Life is infinitely better with you in it. Here’s to you today and forever!"}
  ],

  reasons:[                  // one reason per card
    "Your smile lights up even my most exhausting days.",
    "How effortlessly you understand me without me even needing to say a word.","How safe and at home I feel whenever I am with you.",
    "How comfortable I can be completely, 100% myself around you without any judgment.",
    "The way you encourage me to be the best version of myself every single day.","How you effortlessly balance being my best friend and my partner.",
    "The way you look at me like I'm the only person in a crowded room.","How you ground me when my thoughts start spinning out of control.",
    "The way you love me for exactly who I am, without pretense.","How exciting every single plan for our future feels with you in it.",
    "How much brighter my entire world has been since the day you entered it.","How you turn ordinary, everyday routines into my favorite memories simply by being there.",
    "The gentle strength in the way you hold onto my hand when things get overwhelming.","The way your presence makes every place feel warmer, brighter, and worth coming back to.",
    "The way my heart still skips a beat every time I see you walking toward me.",
    "How fiercely loyal and protective you are of me.","The thoughtful little surprises and gestures you do just to see me smile.",
    "The quiet magic of your touch, which always leaves me wanting more of you.","How effortlessly you turn every shared glance into a moment I never want to forget.",
    "Your breathtaking beauty, the way your eyes and smile light up every room—makes it impossible to stop admiring you.",
    "The captivating curve of your body and how effortlessly you fit against me every time I hold you close.",
    "Because in mind, body, and soul, you are everything I ever hoped for and the best part of my life.",
    "Because no matter what life brings our way, you are the one person I always want beside me.","Because loving you feels less like a choice and more like the very reason my heart beats."
  ],
  /* QUIZ
     q   = question
     o   = options
     a   = index of the correct option (0 = first). Use a list like [0,1,2] if several are correct
     r   = reaction shown after she answers (one line for all, OR a list with one line per option)
     why = reason shown on the "See all the answers" page */
  quiz:[
    {q:"Who is my favourite person in the whole world?",
     o:["Me, myself and I","You","Whoever is serving biriyani"],a:1,
     r:"It was always going to be you.",
     why:"Because you’re the person I would pick over everyone and everything, every single time."},

    {q:"Who is the real boss in this relationship?",
     o:["Me, obviously","You, without even trying","We're equal partners (until you give me THAT LOOK)"],a:1,   // CHECK
     r:"I'm smart enough not to argue with the Birthday Girl.",
     why:"Admitting this just to make you happy on your special day. You're the boss only on your birthday, hehe!"},

    {q:"If I say “I’m 5 minutes away”, where am I really?",
     o:["5 minutes away","Just leaving home","Still looking for my keys"],a:1,   // CHECK
     r:"“5 minutes” is a very flexible unit of time.",
     why:"“5 minutes away” always means I’m just leaving home."},

    {q:"What is my all-time favourite food?",
     o:["Mutton biriyani","You","Anything that’s free"],a:1,
     r:"Biriyani is a very close second.",
     why:"Mutton biriyani is amazing, but nothing beats you."},

    {q:"What do I do when you say “I’m not angry”?",
     o:["Believe you","Panic and apologise anyway","Pretend I’m busy"],a:1,   // CHECK
     r:"I panic. Every single time.",
     why:"I know “I’m not angry” never really means that, so I apologise first."},

    {q:"What is the immediate reaction when you send me a random selfie?",
     o:["Double tap and move on","Stare at it for way too long with a stupid grin on my face","Immediately zoom in on the background"],a:1,   // CHECK
     r:"I literally can't help myself from falling in love with you.",
     why:"You are the cutest, hottest, sweetest, sexiest and the most beautiful girl in the whole universe and I love staring at your photos, zooming into it and admire you for hours."},

    {q:"What is my actual superpower in this relationship?",
     o:["Making you laugh when you’re trying to stay mad","Reading your mind","Both a and b"],a:2,
     r:[
       "Close. That’s only half of it.",
       "Close. That’s the other half.",
       "Both. Obviously. I’m basically a superhero with no cape."
     ],
     why:"I know what you’re thinking before you say it, then I make you laugh right when you’re trying to stay mad. It’s annoying, it’s unfair, and it works every single time."},

    {q:"Which day was the best day of my life?",
     o:["27th July 2023","3rd November 2022","14th April 2023"],a:0,
     r:[
       "27th July 2023 was the day we got lost into ourselves!",
       "I proposed to you for the 1st time on 3rd November 2022.",
       "I proposed to you for the 2nd time between 13th-14th April 2023."
     ],
     why:"Really the happiest day of my life! I was filled with butterflies in my stomach!"},

    {q:"What is the fastest way for you to win any argument with me?",
     o:["Bring up valid points and logic","Give me THAT LOOK or get slightly emotional","Bribe me with food"],a:1,
     r:"Can't argue with my Queen.",
     why:"Instant surrender every single time."},

    {q:"Who is stuck with me forever?",
     o:["You","Definitely you","You, no refunds"],a:[0,1,2],
     r:"No refunds, no exchanges.",
     why:"Every option is correct. You’re stuck with me, and I’m not letting go."}

  ],
  win:"Perfect score. Of course you know me best.",
  lose:"Not bad. You still get the biggest hug."
};
/* ================================================= */

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let typer,taps=0,qi=0,sc=0;
document.title="Happy Birthday, "+C.her;
$("#title").innerHTML="Happy Birthday,<br>"+C.her;
$("#sub").textContent="Six little things, made for you by "+C.me+".";
$("#cakeName").textContent=C.her;

function show(id){
  clearInterval(typer);
  $$(".page").forEach(p=>p.classList.toggle("active",p.id===id));
  $("#back").style.display=id==="menu"?"none":"block";
  scrollTo(0,0);
  const init={wish:initWish,cake:initCake,gift:initGift,game:startQuiz}[id];
  if(init)init();
}
$$("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
$("#back").onclick=()=>show("menu");
$("#mus").onclick=()=>{const a=$("#bgm");a.paused?a.play().catch(()=>{}):a.pause()};

/* wish */
function initWish(){
  const el=$("#wishText");el.textContent="";$("#sign").textContent="";
  let i=0;
  const end=()=>{clearInterval(typer);el.textContent=C.wish;$("#sign").textContent="— "+C.me};
  el.onclick=end;
  typer=setInterval(()=>{el.textContent=C.wish.slice(0,++i);if(i>=C.wish.length)end()},35);
}

/* cake */
const cols=["#f3cdd6","#d8cbe8","#8c2a47","#fbeef0","#c9a7b4"];
function initCake(){
  $("#bunting").innerHTML=Array.from({length:14},(_,i)=>`<i style="--c:${cols[i%5]}"></i>`).join("");
  const d=$("#deco");d.innerHTML="";
  for(let i=0;i<8;i++){const e=document.createElement("span");e.className="balloon";e.style.cssText=`left:${5+i*12}%;background:${cols[i%5]};animation-delay:${-i*1.2}s`;d.append(e)}
  $("#cake").classList.remove("cut");$("#cutMsg").textContent="";$("#cutBtn").disabled=false;
  $$(".candle").forEach(c=>c.classList.remove("out"));
}
$$(".candle").forEach(c=>c.onclick=()=>{
  c.classList.add("out");
  if(!$$(".candle:not(.out)").length)$("#cutMsg").textContent="Wish made? Now cut the cake 🍰";
});
$("#cutBtn").onclick=function(){
  this.disabled=true;$("#cake").classList.add("cut");
  setTimeout(()=>{confetti();$("#cutMsg").textContent="Make a wish, "+C.her+" ✨"},1500);
};
function confetti(){
  for(let i=0;i<70;i++){
    const e=document.createElement("b");e.className="conf";
    e.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%5]};animation-duration:${2.5+Math.random()*2}s;animation-delay:${Math.random()*.6}s`;
    document.body.append(e);setTimeout(()=>e.remove(),5200);
  }
}

/* gift */
function initGift(){taps=0;$("#giftHint").textContent="";$("#giftBox").classList.remove("shake")}
$("#giftBox").onclick=e=>{
  const b=e.currentTarget;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");
  const t=C.giftTeases;
  $("#giftHint").textContent=t[Math.min(taps,t.length-1)];
  taps++;
};

/* my little angel (photos + wishes) */
$("#timeline").innerHTML=C.memories.map(m=>`<figure class="mem"><img src="${m.img}" alt="${m.tag}" onerror="this.outerHTML='<div class=ph>Add photo: ${m.img}</div>'"><figcaption><span class="tag">${m.tag}</span>${m.cap}</figcaption></figure>`).join("");

/* reasons */
$("#reasonsGrid").innerHTML=C.reasons.map(r=>`<button class="flip"><span class="in"><span class="f">♥<small>tap me</small></span><span class="b">${r}</span></span></button>`).join("");
$$(".flip").forEach(f=>f.onclick=()=>f.classList.toggle("on"));

/* mini game */
const right=q=>Array.isArray(q.a)?q.a:[q.a];

function startQuiz(){qi=0;sc=0;renderQ()}

function renderQ(){
  if(qi>=C.quiz.length){renderEnd();return}
  const q=C.quiz[qi],last=qi===C.quiz.length-1;
  $("#quiz").innerHTML=
    `<p class="qn">Question ${qi+1} of ${C.quiz.length}</p><h2>${q.q}</h2>`+
    q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")+
    `<p class="react" id="react"></p><button class="btn" id="next" style="display:none">${last?"See my score":"Next →"}</button>`;
  $$(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,good=right(q);
    $$(".opt").forEach(x=>x.disabled=true);
    if(good.includes(i)){b.classList.add("ok");sc++}
    else{b.classList.add("no");good.forEach(g=>$$(".opt")[g].classList.add("ok"))}
    $("#react").textContent=Array.isArray(q.r)?q.r[i]:(q.r||"");
    const n=$("#next");n.style.display="inline-block";
    n.onclick=()=>{qi++;renderQ()};
  });
}

function renderEnd(noConfetti){
  $("#quiz").innerHTML=
    `<h2>${sc} / ${C.quiz.length}</h2><p class="res">${sc===C.quiz.length?C.win:C.lose}</p>`+
    `<div class="row"><button class="btn" id="again">Play again</button><button class="btn" id="seeAns">See all the answers</button></div>`;
  $("#again").onclick=startQuiz;
  $("#seeAns").onclick=renderAnswers;
  if(sc===C.quiz.length&&!noConfetti)confetti();
}

function renderAnswers(){
  scrollTo(0,0);
  $("#quiz").innerHTML=`<h2>All the answers</h2>`+
    C.quiz.map((q,n)=>`<div class="ans"><small>Question ${n+1}</small><b>${q.q}</b><p class="a">✔ ${right(q).map(i=>q.o[i]).join(" / ")}</p><p class="why">${q.why}</p></div>`).join("")+
    `<div class="row"><button class="btn" id="backScore">Back to my score</button></div>`;
  $("#backScore").onclick=()=>renderEnd(true);
}
</script>
</body>
</html>
